name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: ./scripts/bootstrap.ps1
      - run: cargo test --locked bundled_vosk_forward_slashes -- --ignored
      - run: cargo build --release --locked --bins
      - run: ./scripts/package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceControl-windows-x64
          path: dist/VoiceControl-windows-x64.zip
          retention-days: 14
