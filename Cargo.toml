[package]
name = "voice-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Russian voice commands for Windows media and Discord"
license = "MIT"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
hound = "3.5"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Foundation", "Media_Control", "Win32_Foundation", "Win32_System_Com",
  "Win32_System_WinRT", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_Security", "Win32_UI_HiDpi",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
